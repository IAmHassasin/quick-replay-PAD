# Continuous delivery for main:
#   test -> build the debug APK -> GitHub Release with quick-replay-pad-<version>.apk
#
# The in-app updater (UpdateClient / UpdatePolicy) only offers a release whose tag is
# v<major>.<minor>.<patch> and whose asset is exactly quick-replay-pad-<version>.apk.
# major.minor is versionName in android/app/build.gradle.kts; patch is this workflow's run number.
#
# Required repository secret:
#   ANDROID_DEBUG_KEYSTORE_BASE64  base64 of ~/.android/debug.keystore (keeps the APK signature stable)
# Set it with: bash scripts/ci/set-github-secrets.sh
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          file="android/app/build.gradle.kts"
          line="$(grep -E 'versionName = .*"([0-9]+)\.([0-9]+)\.[0-9]+"' "$file")"
          if [[ ! "$line" =~ versionName\ =\ .*\"([0-9]+)\.([0-9]+)\.[0-9]+\" ]]; then
            echo "::error::versionName in $file must fall back to a version like \"0.2.0\"."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${GITHUB_RUN_NUMBER}"
          if [ "$patch" -gt 99 ]; then
            echo "::error::Workflow run number $patch is the patch and must stay below 100. Bump the minor in $file."
            exit 1
          fi
          version="${major}.${minor}.${patch}"
          code=$((major * 10000 + minor * 100 + patch))
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "version_code=${code}" >> "$GITHUB_OUTPUT"
          echo "Release version: v${version} (versionCode ${code})"

      - name: Unit tests and lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug --stacktrace

  apk:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the shared debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 is required so an update can install over the previous APK."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"

      - name: Build the debug APK
        working-directory: android
        env:
          VERSION: ${{ needs.test.outputs.version }}
          VERSION_CODE: ${{ needs.test.outputs.version_code }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace \
            -PappVersionName="$VERSION" \
            -PappVersionCode="$VERSION_CODE"
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          aapt="$(find "$sdk_root/build-tools" -name aapt -type f | sort | tail -n 1)"
          badging="$("$aapt" dump badging app/build/outputs/apk/debug/app-debug.apk)"
          printf '%s\n' "$badging" | grep -q "versionName='${VERSION}'"
          printf '%s\n' "$badging" | grep -q "versionCode='${VERSION_CODE}'"
          printf '%s\n' "$badging" | grep -q "name='dev.quickreplay.pad'"
          mkdir -p ../dist-release
          cp app/build/outputs/apk/debug/app-debug.apk "../dist-release/quick-replay-pad-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist-release/
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub release
    needs: [test, apk]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist-release

      - name: Generate changelog
        env:
          TAG: ${{ needs.test.outputs.tag }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/ci/generate-changelog.sh "$TAG" changelog.md
          {
            echo "Debug APK of Quick Replay PAD ${TAG}."
            echo
            echo "Install \`quick-replay-pad-${VERSION}.apk\` on the phone (allow \"Install unknown apps\"). Android 8.0+; SOLVE needs Android 11+. App id \`dev.quickreplay.pad\`."
            echo
            cat changelog.md
          } > release-notes.md

      # Draft first, publish last: the app reads releases/latest, which must not
      # point at a release whose APK is still uploading.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.test.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Quick Replay PAD $TAG" \
            --notes-file release-notes.md
          gh release upload "$TAG" dist-release/*
          gh release edit "$TAG" --draft=false --latest
